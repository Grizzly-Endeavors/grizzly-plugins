# Model the Jev checks are calibrated against. Change it only together with a recalibration.
model: jev-1.13.0

# A section whose body (text below its heading) is shorter than this is a finding.
min_section_chars: 200

# Section score = quality / max(1, chars / size_unit_chars) ** size_exponent
# where quality = (sum(weight * positive) - sum(weight * negative)) / sum(positive weights).
size_unit_chars: 1000
size_exponent: 0.25

# The raw section score that passes. This is the calibration knob.
pass_raw_score: 0.45

# Reported scores rescale the raw score linearly so pass_raw_score reads as the
# pass grade and a raw 1.0 reads as 1.0, clamped to 0..1.
grades:
  pass: 0.60
  good: 0.80
  perfect: 0.90

# The overall score (a tracking number) is multiplied by
# min(1, skill_length_ref_chars / body chars) ** skill_length_exponent.
skill_length_ref_chars: 8500
skill_length_exponent: 0.5
