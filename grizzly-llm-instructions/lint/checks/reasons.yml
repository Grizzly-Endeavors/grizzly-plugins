question:
  type: score
  instructions: Does `section.text` explain why this part of the work matters to the people it serves? Consequences attached to single instructions or list items do not count; the explanation is about the part of the work as a whole.
  criteria:
    - "None: the section never says why this part of the work matters."
    - "Implied: the stakes can only be pieced together from consequences attached to individual instructions or items."
    - "Stated: the section says why this part of the work matters to the people it serves, such as 'walls of text lose viewers even for engaging speakers'."
