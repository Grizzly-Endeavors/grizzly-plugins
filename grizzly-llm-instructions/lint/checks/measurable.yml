slice: section
direction: positive
weight: 1
question:
  type: score
  instructions: Does `section.text` give a rubric the reader can check the finished work against, meaning criteria that separate a good result from a poor one?
  criteria:
    - "No rubric: the section gives values, steps, or rules to follow, but no way to judge whether the result is good."
    - "Partial: one or two criteria describe a good result, but the main quality of the work is left unjudged."
    - "Rubric: the section states observable criteria that separate good results from poor ones, such as 'each slide carries one visual that states its point'."
