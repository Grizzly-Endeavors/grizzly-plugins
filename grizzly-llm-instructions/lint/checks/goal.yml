slice: section
direction: positive
weight: 3
question:
  type: score
  instructions: Does `section.text` state the outcome its work should produce for the people it serves, such as the viewer, user, or maintainer?
  criteria:
    - "None: the section gives steps, rules, definitions, or data, with no outcome for anyone."
    - "Implied: an outcome can be inferred, or the section names an aim for the work itself, such as 'fix the root cause', without saying what it gives the people it serves."
    - "Stated: the section states what good work gives the people it serves, such as 'slides that hold a viewer's attention'."
