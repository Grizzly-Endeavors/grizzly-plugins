question:
  type: score
  instructions: How heavy is the formatting in `section.text` compared to what the content needs?
  criteria:
    - "Plain: prose, lists, and tables with emphasis on a few key terms."
    - "Noticeable: frequent bold or decorative symbols, but the content still reads clearly."
    - "Heavy: bold on most lines, decorative symbols or emoji, dividers, or diagrams that add no information."
