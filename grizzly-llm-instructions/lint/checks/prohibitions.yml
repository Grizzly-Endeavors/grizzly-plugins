slice: section
applies_to: [instruction, route]
direction: negative
weight: 5
curve: 2
question:
  type: score
  instructions: How many of the reader's instructions in `section.text` are commands to refrain from an action, such as 'do not', 'never', 'avoid', or 'X, not Y', compared to commands to take an action? Descriptions of problems, smells, symptoms, or mistakes to look for are not commands.
  criteria:
    - "None: the section describes only what to do."
    - "Some: one or two prohibitions."
    - "Much: prohibitions make up a large part of the section."
    - "Mostly: the section defines the target mainly by what to avoid."
